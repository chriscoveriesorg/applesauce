[package]
name = "applesauce-cli"
version = "0.5.31"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A command-line interface for compressing and decompressing files using macos transparent compression"
repository = "https://github.com/chriscoveriesorg/applesauce"
readme = "../../README.md"

[[bin]]
name = "applesauce"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["zlib", "lzfse", "lzvn"]

zlib = ["applesauce/zlib"]
lzfse = ["applesauce/lzfse"]
lzvn = ["applesauce/lzvn"]
lzbitmap = ["applesauce/lzbitmap"]

[dependencies]
applesauce = { version = "^0.8.10", path = "../applesauce", default-features = false }
applesauce-core = { version = "^0.4.14", path = "../applesauce-core", default-features = false }

cfg-if = "1.0.4"
clap = { version = "4.6", features = ["derive"] }
humansize = "2.1"
indicatif = "0.18.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
tempfile = "3.27"
tikv-jemallocator = "0.7"
tracing = "0.1"
tracing-chrome = "0.7"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
