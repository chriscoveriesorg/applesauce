name: FSKit host lifecycle

on:
  pull_request:
    paths:
      - 'fskit/Host/**'
      - 'fskit/tests/OperationGateTests.swift'
      - '.github/workflows/fskit-host-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'fskit/Host/**'
      - 'fskit/tests/OperationGateTests.swift'
      - '.github/workflows/fskit-host-lifecycle.yml'

permissions:
  contents: read

concurrency:
  group: ascf-host-lifecycle-${{ github.ref }}
  # Keep required host-gate evidence for each commit; newer pushes must not cancel it.
  cancel-in-progress: false

jobs:
  operation-gate:
    # No FSKit dependency: the same production gate runs on this Swift host.
    # The complete macOS 27 app/extension build remains mandatory separately.
    # The FSKit SDK workflow already compiles successfully on this provisioned
    # macOS 27 label; macos-latest host-only jobs were cancelled without a runner.
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Record Swift compiler and test request ownership
        run: |
          set -euo pipefail
          xcrun swiftc --version
          xcrun swiftc -swift-version 5 -warnings-as-errors \
            fskit/Host/OperationGate.swift fskit/Host/CorruptFixtureProof.swift fskit/tests/OperationGateTests.swift \
            -o "$RUNNER_TEMP/ascf-operation-gate-tests"
          "$RUNNER_TEMP/ascf-operation-gate-tests"
