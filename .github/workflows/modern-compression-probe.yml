name: Probe macOS 27 compression codecs

# Automatic runs use generated in-memory fixtures only. Private APFS trials
# require an explicit workflow_dispatch opt-in and are NEVER run on PR/push.
on:
  pull_request:
    paths:
      - 'Cargo.*'
      - 'crates/**'
      - 'hack/*probe*'
      - '.github/workflows/modern-compression-probe.yml'
  push:
    branches: [main, 'modern-compression/**', 'experimental/**']
    paths:
      - 'Cargo.*'
      - 'crates/**'
      - 'hack/*probe*'
      - '.github/workflows/modern-compression-probe.yml'
  workflow_dispatch:
    inputs:
      probe_filesystem:
        description: 'Accept host-kernel-panic risk: private APFS controls 12/14 on a disposable image (27.2+)'
        type: boolean
        default: false
        required: true
      probe_candidates:
        description: 'Also request types 15–22 after controls pass (requires probe_filesystem; NOT Raven/Mesh IDs)'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

# A newer PR or non-main branch push may supersede older work. Preserve
# every main commit and each manually authorised filesystem investigation:
# even pending jobs share a concurrency group, so manual runs need run_id.
concurrency:
  group: modern-compression-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  # Run formatting validation before allocating the provisioned macOS host.
  # Covers pull requests, main pushes and explicit operator dispatches; this
  # read-only job never performs private APFS trials or consumes their opt-ins.
  preflight:
    name: Portable formatting preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  probe:
    needs: preflight
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Identify exact OS, build, SDK, and toolchain
        run: |
          set -euo pipefail
          PROBE_RESULTS="$RUNNER_TEMP/modern-compression-results"
          printf 'PROBE_RESULTS=%s\n' "$PROBE_RESULTS" >> "$GITHUB_ENV"
          mkdir -p "$PROBE_RESULTS"
          {
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'UTC: %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            sw_vers
            uname -srm
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk macosx --show-sdk-path
            xcrun swiftc --version
            xcrun clang --version
          } 2>&1 | tee "$PROBE_RESULTS/environment.txt"
          {
            printf '## Exact runner environment\n\n```text\n'
            cat "$PROBE_RESULTS/environment.txt"
            printf '```\n\nBuffer success does not establish transparent APFS support.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report filesystem compressor components (read-only, not a support test)
        run: |
          {
            /usr/bin/kmutil showloaded 2>&1 | /usr/bin/grep -E 'AppleFSCompression|decmpfs' || true
            /usr/sbin/ioreg -l -w 0 -p IOService | /usr/bin/grep -E 'AppleFSCompression|providesType' | /usr/bin/head -n 40 || true
          } | tee "$PROBE_RESULTS/filesystem-components.txt"
      - name: Inspect native decoder catalogue declarations (read-only, candidate hints only)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s hack -p 'test_decmpfs_catalogue_probe.py' \
            2>&1 | tee "$PROBE_RESULTS/decmpfs-catalogue-tests.log"
          python3 hack/decmpfs_catalogue_probe.py \
            --component-log "$PROBE_RESULTS/filesystem-components.txt" --system \
            | tee "$PROBE_RESULTS/decmpfs-catalogue-hints.json"
          python3 - "$PROBE_RESULTS/decmpfs-catalogue-hints.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["schema_version"] == 1
          assert report["kind"] == "read-only-decmpfs-catalogue-hints"
          assert report["kernel_decoder_proven"] is False
          assert report["codec_identity_proven"] is False
          assert report["native_raven_mesh_writes_permitted"] is False
          PY
          printf '## Native decmpfs registration clues\n\nRead-only catalogue hints captured in `decmpfs-catalogue-hints.json`. Presence or absence of a declaration is not proof of a registered decoder or a Raven/Mesh format.\n' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Inventory existing Apple system on-disk decmpfs types (read-only)
        run: |
          set -euo pipefail
          # This walks Apple system paths only. It NEVER writes a decmpfs xattr,
          # creates a compressed file, or probes unknown types in the kernel.
          python3 -m unittest discover -s hack -p 'test_native_type_probe.py' \
            2>&1 | tee "$PROBE_RESULTS/native-type-probe-tests.log"
          python3 hack/native-type-probe.py --max-files 30000 --max-seconds 60 \
            --output "$PROBE_RESULTS/native-on-disk-types.json" \
            2>&1 | tee "$PROBE_RESULTS/native-on-disk-types.stdout.log"
          python3 - "$PROBE_RESULTS/native-on-disk-types.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              report = json.load(stream)
          assert report["schema_version"] == 1
          assert report["kind"] == "existing-system-decmpfs-headers-readonly"
          assert report["files_seen"] > 0
          # A scan that opened no valid headers is not evidence of on-disk types.
          assert 0 < report["headers_read"] <= report["compressed_flagged"] <= report["files_seen"]
          assert sum(item["count"] for item in report["types"].values()) == report["headers_read"]
          assert not report["native_raven_mesh_writes_permitted"]
          assert not report["kernel_decoder_proven"]
          assert not report["codec_identity_proven"]
          for raw in ("15", "16"):
              if raw in report["types"]:
                  assert report["types"][raw]["known_format"] is None
          print("PASS: read-only system header inventory remains fail-closed")
          PY
          {
            printf '## Pre-existing native file headers (read-only)\n\n'
            printf 'On-disk types and scan coverage are in \`native-on-disk-types.json\`. '
            printf 'These files predate this run. No kernel writer was exercised. '
            printf 'Type observation alone proves neither a registered decoder nor Raven/Mesh identity.\n\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compile and exercise SDK buffer codecs (no APFS conversion)
        run: |
          set -euo pipefail
          xcrun swiftc -O hack/modern-compression-probe.swift -o "$RUNNER_TEMP/modern-compression-probe" \
            2>&1 | tee "$PROBE_RESULTS/swift-build.log"
          "$RUNNER_TEMP/modern-compression-probe" --json \
            2> >(tee "$PROBE_RESULTS/swift-buffer.stderr.log" >&2) | tee "$PROBE_RESULTS/swift-buffer.json"
          python3 - "$PROBE_RESULTS/swift-buffer.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              report = json.load(handle)
          assert report["schemaVersion"] == 1
          assert report["kernelSupportTested"] is False
          assert report["kind"] == "compression-buffer-probe"
          results = report["results"]
          assert len(results) == 12
          for fixture in {result["input"] for result in results}:
              rows = [result for result in results if result["input"] == fixture]
              assert {row["codec"] for row in rows} == {"LZFSE", "LZRAVEN", "LZMESH"}
              assert all(row["verified"] is True and row["compressedBytes"] > 0 for row in rows)
          PY
          {
            printf '## SDK buffer round-trips\n\n'
            printf 'LZFSE, LZRAVEN, and LZMESH passed byte-for-byte checks on generated JSONL, high-entropy, one-byte, and 64 KiB + 1 byte inputs.\n\n'
            printf 'Machine-readable measurements are in `swift-buffer.json`; these are single-run smoke timings, not benchmarks.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Compile private helper without executing it
        run: |
          set -euo pipefail
          xcrun clang -std=c11 -Wall -Wextra -Werror -framework CoreFoundation \
            hack/apfs-type-probe.c -o "$RUNNER_TEMP/apfs-type-probe" \
            2>&1 | tee "$PROBE_RESULTS/private-helper-build.log"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test Rust buffer implementation
        run: |
          set -euo pipefail
          { rustc --version; cargo --version; } | tee "$PROBE_RESULTS/rust-toolchain.txt"
          cargo test --locked -p applesauce-core --all-features apple_buffer::tests:: \
            2>&1 | tee "$PROBE_RESULTS/rust-buffer-tests.log"
          # Exercise native decmpfs block bounds on the macOS 27 host too.
          # Generated in-memory fixtures only; no APFS filesystem writes.
          cargo test --locked -p applesauce-core --all-features compressor::tests:: \
            2>&1 | tee "$PROBE_RESULTS/native-compressor-tests.log"
          cargo test --locked -p applesauce-cli --features lzbitmap codecs::tests:: \
            2>&1 | tee "$PROBE_RESULTS/rust-cli-tests.log"
          cargo test --locked -p applesauce-cli archive::tests:: -- --nocapture \
            2>&1 | tee "$PROBE_RESULTS/rust-archive-cli-tests.log"
          printf '## Cold-file archive CLI\n\nGenerated Raven/Mesh archive create, verify, extract and corrupt-tail refusal tests executed on this macOS 27 host. Sources remained unchanged. These commands create separate archives, not native decmpfs files.\n\n' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-check versioned benchmark fixtures and speed harness
        env:
          APPLESAUCE_BENCH_SUITE: smoke
          # Exercise manifest creation in a previously nonexistent directory.
          APPLESAUCE_BENCH_MANIFEST: ${{ runner.temp }}/applesauce-smoke-manifest/nested/manifest.csv
        run: |
          set -euo pipefail
          cargo test --locked -p applesauce-core --test benchmark_fixtures \
            2>&1 | tee "$PROBE_RESULTS/benchmark-fixtures-tests.log"
          python3 -m unittest discover -s hack -p 'test_benchmark_*.py' \
            2>&1 | tee "$PROBE_RESULTS/benchmark-summary-tests.log"
          cargo bench --locked -p applesauce-core --bench modern_buffer -- --test \
            2>&1 | tee "$PROBE_RESULTS/benchmark-smoke-tests.log"
          python3 hack/validate-benchmark-matrix.py "$APPLESAUCE_BENCH_MANIFEST" smoke \
            2>&1 | tee "$PROBE_RESULTS/benchmark-smoke-matrix-check.txt"
          cp "$APPLESAUCE_BENCH_MANIFEST" "$PROBE_RESULTS/benchmark-smoke-manifest.csv"
          printf '## Benchmark harness\n\nDeterministic fixtures, CSV report parser, and macOS public-buffer encode/decode smoke cases passed. Full timed Criterion runs are manual-only.\n' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise read-only Rust capabilities and generated buffer benchmark
        run: |
          set -euo pipefail
          cargo run --locked -p applesauce-cli -- capabilities --json \
            | tee "$PROBE_RESULTS/rust-capabilities.json"
          cargo run --locked -p applesauce-cli --features lzbitmap -- capabilities --json \
            | tee "$PROBE_RESULTS/rust-capabilities-lzbitmap.json"
          cargo run --locked -p applesauce-cli -- benchmark-codecs --json \
            | tee "$PROBE_RESULTS/rust-buffer.json"
          for codec in lzraven lzmesh; do
            if cargo run --locked -p applesauce-cli -- capabilities --json --require-native "$codec" \
              > "$PROBE_RESULTS/rust-require-$codec.json" \
              2> "$PROBE_RESULTS/rust-require-$codec.stderr.log"; then
              printf 'ERROR: %s must not be advertised as a native writer.\n' "$codec" >&2
              exit 1
            else
              status=$?
              if [[ $status != 1 ]]; then
                printf 'Unexpected failure status %s for %s capability guard.\n' "$status" "$codec" >&2
                exit 1
              fi
            fi
          done
          python3 - "$PROBE_RESULTS" <<'PY'
          import itertools
          import json
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          public_buffers = {"zlib", "lzfse", "lzbitmap", "lzmesh", "lzraven"}
          for filename, bitmap_enabled in (
              ("rust-capabilities.json", False),
              ("rust-capabilities-lzbitmap.json", True),
              ("rust-require-lzraven.json", False),
              ("rust-require-lzmesh.json", False),
          ):
              report = json.loads((root / filename).read_text())
              assert report["schema_version"] == 1
              assert report["host"]["os"] == "macos"
              assert int(report["host"]["macos_version"].split(".")[0]) >= 27
              assert report["host"]["macos_build"]
              codecs = {codec["name"]: codec for codec in report["codecs"]}
              assert set(codecs) == public_buffers | {"lzvn"}
              for name in public_buffers:
                  assert codecs[name]["apple_buffer"]["available"] is True
                  assert codecs[name]["apple_buffer"]["verified_roundtrip"] is True
              for name in ("lzmesh", "lzraven"):
                  assert codecs[name]["native_decmpfs"]["writable"] is False
                  assert codecs[name]["native_decmpfs"]["decmpfs_types"] == []
              assert codecs["lzbitmap"]["native_decmpfs"]["writable"] is bitmap_enabled
          benchmark = json.loads((root / "rust-buffer.json").read_text())
          assert benchmark["schema_version"] == 1
          rows = benchmark["results"]
          assert rows and all(row["status"] == "ok" for row in rows)
          assert all(row["verified_roundtrip"] is True and row["encoded_bytes"] > 0 for row in rows)
          expected = set(itertools.product(
              public_buffers,
              {row["input"] for row in rows},
              {"whole-buffer", "independent-64k"},
          ))
          actual = {(row["codec"], row["input"], row["layout"]) for row in rows}
          assert actual == expected and len(rows) == len(expected)
          print("PASS: Rust codec round-trips, benchmark layouts, JSON schema, and native fail-closed guards.")
          PY
          printf '## Rust integration contract\n\nBuffer tests and JSON contract checks passed, including whole-buffer/independent-64KiB layouts and rejection of native Raven/Mesh requests.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Private APFS trial (explicit manual opt-in only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.probe_filesystem }}
        env:
          PROBE_CANDIDATES: ${{ inputs.probe_candidates }}
        run: |
          set -euo pipefail
          version="$(sw_vers -productVersion)"
          IFS='.' read -r major minor patch <<< "$version"
          minor=${minor:-0}
          if (( 10#$major < 27 || (10#$major == 27 && 10#$minor < 2) )); then
            printf 'APFS trial skipped on macOS %s: project policy requires 27.2+.\n' "$version" \
              | tee "$PROBE_RESULTS/private-trial-skipped.txt" >> "$GITHUB_STEP_SUMMARY"
            printf 'The 27.2 gate is a safety policy, not evidence of codec or kernel support.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          args=(--acknowledge-kernel-panic-risk)
          if [[ "$PROBE_CANDIDATES" == 'true' ]]; then args+=(--candidates); fi
          printf '## Explicit private APFS trial\n\nA disposable image does not isolate the host kernel. Results require detach, read-only reattach, and exact-byte verification. Matching IDs do not identify LZRAVEN/LZMESH.\n\n' >> "$GITHUB_STEP_SUMMARY"
          TMPDIR="$PROBE_RESULTS" bash hack/run-local-apfs-probe.sh "${args[@]}" \
            2>&1 | tee "$PROBE_RESULTS/private-trial.log"
          printf 'Private-trial TSV and mount logs are included in the result artifact. Disk images are retained on the runner but not uploaded.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain reports even when a test fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-compression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/modern-compression-results/**/*.json
            ${{ runner.temp }}/modern-compression-results/**/*.tsv
            ${{ runner.temp }}/modern-compression-results/**/*.log
            ${{ runner.temp }}/modern-compression-results/**/*.txt
          if-no-files-found: warn
          retention-days: 30
