name: Benchmark evidence harness regressions

on:
  pull_request:
    paths:
      - 'hack/benchmarks/2026-11-06-m1max-macos27.2/*.py'
      - 'hack/criterion-confidence.py'
      - 'hack/compare-codec-evidence.py'
      - 'hack/test_compare_codec_evidence.py'
      - 'hack/summarize-benchmarks.py'
      - 'hack/validate-benchmark-matrix.py'
      - 'hack/test_criterion_confidence.py'
      - 'hack/prepare_benchmark_evidence.py'
      - 'hack/test_prepare_benchmark_evidence.py'
      - '.github/workflows/benchmark-codecs.yml'
      - '.github/workflows/benchmark-evidence-tests.yml'
  push:
    branches: [main]
    paths:
      - 'hack/benchmarks/2026-11-06-m1max-macos27.2/*.py'
      - 'hack/criterion-confidence.py'
      - 'hack/compare-codec-evidence.py'
      - 'hack/test_compare_codec_evidence.py'
      - 'hack/summarize-benchmarks.py'
      - 'hack/validate-benchmark-matrix.py'
      - 'hack/test_criterion_confidence.py'
      - 'hack/prepare_benchmark_evidence.py'
      - 'hack/test_prepare_benchmark_evidence.py'
      - '.github/workflows/benchmark-codecs.yml'
      - '.github/workflows/benchmark-evidence-tests.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Compile benchmark scripts
        run: python3 -m compileall -q hack/benchmarks/2026-11-06-m1max-macos27.2
      - name: Verify Criterion confidence interval export
        run: |
          python3 -m py_compile hack/criterion-confidence.py hack/test_criterion_confidence.py
          python3 -m unittest discover -s hack -p 'test_criterion_confidence.py' -v
      - name: Verify per-run Criterion evidence isolation
        run: |
          python3 -m py_compile hack/prepare_benchmark_evidence.py hack/test_prepare_benchmark_evidence.py
          python3 -m unittest discover -s hack -p 'test_prepare_benchmark_evidence.py' -v
      - name: Verify benchmark fail-closed controls
        run: |
          python3 -m unittest discover \
            -s hack/benchmarks/2026-11-06-m1max-macos27.2 \
            -p 'test_*.py' -v
