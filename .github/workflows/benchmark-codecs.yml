name: Benchmark Apple buffer codecs (speed and ratio)

# Intentionally owner-triggered: shared runners are too noisy for an automated
# performance-regression gate. The PR #4 comment trigger is an alternate manual
# entrypoint when workflow_dispatch is inaccessible to connected automation.
# Both routes run on xcode-27 and retain exactly the same raw Criterion evidence.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Generated data and number of benchmark cases'
        type: choice
        options: [smoke, standard, extended]
        default: standard
        required: true

permissions:
  contents: read

jobs:
  criterion:
    # Comments on any other issue/PR, including untrusted comments, cannot
    # allocate a benchmark runner. This trigger uses default-branch source,
    # never code or input read from the commenting user's PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 4 &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'chriscoveries' &&
       github.event.comment.body == '/applesauce-benchmark standard')
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      APPLESAUCE_BENCH_SUITE: ${{ github.event_name == 'issue_comment' && 'standard' || inputs.suite }}
      # Cargo executes benchmark binaries from the package root, not necessarily
      # from the workspace. Keep the manifest alongside the workflow's artifact.
      APPLESAUCE_BENCH_MANIFEST: ${{ github.workspace }}/target/applesauce-bench/manifest.csv
      BENCH_RESULTS: target/applesauce-bench
      BENCHMARK_TRIGGER_URL: ${{ github.event.comment.html_url || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Reset generated Criterion evidence from earlier runner invocations
        run: python3 hack/prepare_benchmark_evidence.py
      - name: Capture exact software and hardware provenance
        run: |
          set -euo pipefail
          mkdir -p "$BENCH_RESULTS"
          {
            printf 'UTC: %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'Suite: %s\n' "$APPLESAUCE_BENCH_SUITE"
            printf 'Runner: %s\n' "$RUNNER_NAME"
            printf 'Trigger event: %s\n' "$GITHUB_EVENT_NAME"
            if [ "$GITHUB_EVENT_NAME" = 'issue_comment' ]; then
              printf 'Trigger comment: %s\n' "$BENCHMARK_TRIGGER_URL"
            fi
            sw_vers
            uname -srm
            sysctl -n hw.model || true
            sysctl -n machdep.cpu.brand_string || true
            sysctl -n hw.logicalcpu || true
            sysctl -n hw.memsize || true
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            rustc --version --verbose
            cargo --version
          } 2>&1 | tee "$BENCH_RESULTS/environment.txt"
      - name: Run Criterion with warmup, sampling and confidence intervals
        run: |
          set -euo pipefail
          case "$APPLESAUCE_BENCH_SUITE" in
            smoke)
              warmup=1; measurement=2; samples=20 ;;
            standard)
              warmup=1; measurement=3; samples=30 ;;
            extended)
              warmup=2; measurement=5; samples=50 ;;
            *)
              printf 'Unknown benchmark suite: %s\n' "$APPLESAUCE_BENCH_SUITE" >&2
              exit 2 ;;
          esac
          printf 'Criterion: %s warmup=%ss measurement=%ss samples=%s\n' \
            "$APPLESAUCE_BENCH_SUITE" "$warmup" "$measurement" "$samples" \
            | tee "$BENCH_RESULTS/config.txt"
          # macOS time -l adds suite-level user/system CPU time and peak RSS.
          # This is whole-invocation telemetry, not a per-codec allocation count.
          /usr/bin/time -l cargo bench --locked -p applesauce-core --bench modern_buffer -- \
            --noplot --warm-up-time "$warmup" \
            --measurement-time "$measurement" --sample-size "$samples" \
            2>&1 | tee "$BENCH_RESULTS/criterion.log"
      - name: Capture whole-invocation CPU and peak RSS (not per-codec allocations)
        run: |
          set -euo pipefail
          python3 hack/parse-benchmark-resources.py \
            "$BENCH_RESULTS/criterion.log" "$BENCH_RESULTS/resource-usage.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Produce complete per-case CSV and concise comparison
        run: |
          set -euo pipefail
          python3 hack/validate-benchmark-matrix.py \
            "$APPLESAUCE_BENCH_MANIFEST" "$APPLESAUCE_BENCH_SUITE" \
            | tee "$BENCH_RESULTS/matrix-check.txt"
          python3 hack/summarize-benchmarks.py \
            "$APPLESAUCE_BENCH_MANIFEST" target/criterion \
            "$BENCH_RESULTS/summary.csv" \
            | tee "$BENCH_RESULTS/summary.md" >> "$GITHUB_STEP_SUMMARY"
          python3 hack/criterion-confidence.py \
            "$APPLESAUCE_BENCH_MANIFEST" "$BENCH_RESULTS/summary.csv" \
            target/criterion "$BENCH_RESULTS/confidence.csv" "$APPLESAUCE_BENCH_SUITE" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          python3 hack/compare-codec-evidence.py \
            "$BENCH_RESULTS/confidence.csv" "$APPLESAUCE_BENCH_SUITE" \
            "$BENCH_RESULTS/raven-mesh-comparison.csv" \
            | tee "$BENCH_RESULTS/raven-mesh-comparison.md" >> "$GITHUB_STEP_SUMMARY"
          python3 hack/rank-codec-evidence.py \
            "$BENCH_RESULTS/confidence.csv" "$APPLESAUCE_BENCH_SUITE" \
            "$BENCH_RESULTS/all-codecs-ranking.csv" \
            | tee "$BENCH_RESULTS/all-codecs-ranking.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\nRaw Criterion estimates and samples are available in the downloadable artifact.\n' \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Retain raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: applesauce-criterion-${{ github.event_name == 'issue_comment' && 'standard' || inputs.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/applesauce-bench/**
            target/criterion/**
          retention-days: 90
          if-no-files-found: warn
