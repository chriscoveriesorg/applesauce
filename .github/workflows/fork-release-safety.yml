name: Fork release safety

on:
  push:
    paths:
      - 'dist-workspace.toml'
      - '.github/workflows/applesauce-cli-release.yml'
      - '.github/workflows/release-plz.yml'
      - '.github/workflows/fork-release-safety.yml'
      - '.github/fork-release-build-setup.yml'
      - 'hack/verify-fork-release.sh'
      - 'hack/test_fork_release.py'
      - 'crates/**/Cargo.toml'
  pull_request:
    paths:
      - 'dist-workspace.toml'
      - '.github/workflows/applesauce-cli-release.yml'
      - '.github/workflows/release-plz.yml'
      - '.github/workflows/fork-release-safety.yml'
      - '.github/fork-release-build-setup.yml'
      - 'hack/verify-fork-release.sh'
      - 'hack/test_fork_release.py'
      - 'crates/**/Cargo.toml'

permissions:
  contents: read

jobs:
  fork-release-contract:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "claw"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Ensure Python 3 is available
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null 2>&1; then
            if [ "$(id -u)" -eq 0 ]; then
              apt-get update
              apt-get install -y python3
            else
              sudo apt-get update
              sudo apt-get install -y python3
            fi
          fi
          python3 --version
      - uses: actions/checkout@v4
      - name: Check fork binary release and tag gates
        run: python3 -m unittest discover -s hack -p 'test_fork_release.py' -v
