on: push

name: Continuous integration

# Each push supersedes the previous unmerged branch head. Cancel its macOS
# matrix before queuing another three jobs on the constrained xcode-27 pool.
# Every latest-head run still executes the complete existing test matrix.
permissions:
  contents: read

concurrency:
  group: applesauce-cargo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Use the same provisioned macOS runner that executes the native codec probe.
    # The macos-latest matrix has been cancelled before runner assignment.
    runs-on: xcode-27
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly

    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      # Reject rustfmt-only mistakes before compiling and running four sets
      # of native codec tests on every stable/beta/nightly matrix member.
      - name: Test formatting
        run: cargo fmt --all -- --check

      - name: Caching
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Validate offline benchmark summary contract
        run: python3 -m unittest discover -s hack -p 'test_benchmark_summary.py'
      - name: Validate offline benchmark matrix contract
        run: python3 -m unittest discover -s hack -p 'test_benchmark_matrix.py'
      - name: Run tests with system lzfse
        run: cargo test --workspace --features system-lzfse --all-targets
      - name: Test opt-in native LZBitmap on generated temporary files
        run: cargo test --workspace --features lzbitmap --all-targets
      - name: Run tests with only zlib
        run: cargo test --workspace --no-default-features --features zlib --all-targets

      - name: Check for clippy warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check opt-in native LZBitmap for clippy warnings
        run: cargo clippy --workspace --features lzbitmap --all-targets -- -D warnings
