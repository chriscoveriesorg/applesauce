on: push

name: Continuous integration

# A new push may supersede only an unmerged feature-branch run. Give every
# main commit its own group so merges and release qualification are never
# silently cancelled or displaced by a later push.
permissions:
  contents: read

concurrency:
  group: applesauce-cargo-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && startsWith(github.ref, 'refs/heads/') }}

jobs:
  # Check formatting on a disposable Linux runner before reserving any of
  # the scarce macOS xcode-27 slots. rustfmt is platform-independent here.
  preflight:
    name: Formatting preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Install Rust formatting
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Test formatting
        run: cargo fmt --all -- --check

  ci:
    needs: preflight
    # Use the same provisioned macOS runner that executes the native codec probe.
    # The macos-latest matrix has been cancelled before runner assignment.
    runs-on: xcode-27
    strategy:
      matrix:
        rust:
          - stable
          - beta
          - nightly

    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - name: Install rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - name: Caching
        uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Validate offline benchmark summary contract
        run: python3 -m unittest discover -s hack -p 'test_benchmark_summary.py'
      - name: Validate offline benchmark matrix contract
        run: python3 -m unittest discover -s hack -p 'test_benchmark_matrix.py'
      - name: Run tests with system lzfse
        run: cargo test --workspace --features system-lzfse --all-targets
      - name: Test opt-in native LZBitmap on generated temporary files
        run: cargo test --workspace --features lzbitmap --all-targets
      - name: Run tests with only zlib
        run: cargo test --workspace --no-default-features --features zlib --all-targets

      - name: Check for clippy warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check opt-in native LZBitmap for clippy warnings
        run: cargo clippy --workspace --features lzbitmap --all-targets -- -D warnings
